# Generates the stickydisk gRPC client into src/gen/ from proto/.
# Uses LOCAL plugins (installed as devDependencies) so generation needs no
# network and no buf.build / BUF_TOKEN access. src/gen/ is git-ignored and
# regenerated by `npm run build`; pin the plugin versions in package.json so
# the generated code — and therefore dist/index.js — stays reproducible.
version: v2
plugins:
  - local: ./node_modules/.bin/protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=none
  - local: ./node_modules/.bin/protoc-gen-connect-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=none
